name: 自動更新超商門市資料 (Auto Update Stores)

on:
  schedule:
    # 每日 UTC 00:00 (台灣時間每日早上 8 點)
    - cron: '0 0 * * *'

  # 允許在 GitHub Actions 頁面手動觸發
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 取得最新程式碼 (Checkout)
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行爬蟲程式 (7-ELEVEN)
        id: seven
        continue-on-error: true
        run: python 711.py

      - name: 執行爬蟲程式 (全家)
        id: familymart
        continue-on-error: true
        run: python familymart.py

      - name: 執行爬蟲程式 (萊爾富)
        id: hilife
        continue-on-error: true
        run: python hilife.py

      - name: 執行爬蟲程式 (OK超商)
        id: okmart
        continue-on-error: true
        run: python okmart.py

      - name: 檢查並提交變更
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add 'stores*.json' README.MD

          if git diff --staged --quiet; then
            echo "門市資料沒有變動，跳過提交。"
          else
            git commit -m "chore: 自動更新超商門市資料 [skip ci]"
            git push
          fi

      # continue-on-error 會讓失敗的步驟顯示為成功，這裡補一個檢查讓失敗看得見。
      # 放在提交之後，確保其他品牌的資料仍會正常更新。
      - name: 回報爬蟲失敗
        if: steps.seven.outcome == 'failure' || steps.familymart.outcome == 'failure' || steps.hilife.outcome == 'failure' || steps.okmart.outcome == 'failure'
        env:
          SEVEN: ${{ steps.seven.outcome }}
          FAMILYMART: ${{ steps.familymart.outcome }}
          HILIFE: ${{ steps.hilife.outcome }}
          OKMART: ${{ steps.okmart.outcome }}
        run: |
          echo "::error::以下爬蟲執行失敗，對應品牌的資料未更新："
          if [ "$SEVEN" = "failure" ]; then echo "::error::7-ELEVEN (711.py)"; fi
          if [ "$FAMILYMART" = "failure" ]; then echo "::error::全家 (familymart.py)"; fi
          if [ "$HILIFE" = "failure" ]; then echo "::error::萊爾富 (hilife.py)"; fi
          if [ "$OKMART" = "failure" ]; then echo "::error::OK超商 (okmart.py)"; fi
          exit 1
